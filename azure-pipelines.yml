trigger: none
pr:
  branches:
    include:
      - main
variables:
  PNPM_CACHE_FOLDER: $(Pipeline.Workspace)/.pnpm-store
  CARGO_HOME: $(Pipeline.Workspace)/.cargo
  RUSTUP_HOME: $(Pipeline.Workspace)/.rustup
jobs:
  - job: build_desktop
    displayName: "Tauri & Vue — Check, Lint & Build"
    pool:
      vmImage: "ubuntu-22.04"
    steps:
      - script: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        displayName: "Install Tauri System Dependencies"

      - script: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "##vso[task.prependpath]$(CARGO_HOME)/bin"
        displayName: "Install Rust Toolchain"

      - task: UseNode@1
        inputs:
          version: "26.x"
        displayName: "Install Node 26"

      - script: corepack enable && corepack prepare pnpm@11.3.0 --activate
        displayName: "Enable pnpm"

      - script: pnpm config set store-dir $(PNPM_CACHE_FOLDER)
        displayName: "Set pnpm Store Location"

      - task: Cache@2
        inputs:
          key: 'pnpm | "$(Agent.OS)" | pnpm-lock.yaml'
          path: $(PNPM_CACHE_FOLDER)
        displayName: "Cache pnpm Store"

      - task: Cache@2
        inputs:
          key: 'cargo | "$(Agent.OS)" | src-tauri/Cargo.lock'
          path: $(CARGO_HOME)
        displayName: "Cache Cargo Registry"

      - task: Cache@2
        inputs:
          key: 'rustup | "$(Agent.OS)"'
          path: $(RUSTUP_HOME)
        displayName: "Cache Rust Toolchain"

      - script: pnpm install --frozen-lockfile
        displayName: "Install Frontend Dependencies"

      - script: pnpm vue-tsc --noEmit
        displayName: "Type Check Vue App"

      - script: pnpm lint
        displayName: "Lint Frontend"

      - script: pnpm tauri build
        displayName: "Build Tauri Desktop App"
